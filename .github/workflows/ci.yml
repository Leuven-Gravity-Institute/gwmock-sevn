name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:

permissions:
    contents: read

jobs:
    test:
        strategy:
            matrix:
                # Latest resolutions run everywhere; the SPEC 0 minimum
                # (lowest-direct) runs on ubuntu with the oldest supported
                # Python, since floor versions predate newer interpreters'
                # wheels.
                python-version: ['3.13', '3.14', '3.15']
                # No Windows: SEVN is POSIX C++ and its build does not support MSVC.
                os: [ubuntu-latest, macos-latest]
                resolution: [highest]
                include:
                    - os: ubuntu-latest
                      python-version: '3.13'
                      resolution: lowest-direct
        runs-on: ${{ matrix.os }}
        env:
            # The SEVN track tables the tests fetch, kept between runs: GitLab rate-limits downloads.
            GWMOCK_SEVN_CACHE: ${{ github.workspace }}/.sevn-cache
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: 'true'

            - name: Cache the SEVN track tables
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: .sevn-cache
                  key:
                      sevn-tables-${{
                      hashFiles('src/gwmock_sevn/data/tables/*.json') }}

            - name: Install dependencies
              shell: bash
              env:
                  RESOLUTION: ${{ matrix.resolution }}
              run: |
                  if [ "$RESOLUTION" = "lowest-direct" ]; then
                      uv sync --group dev --upgrade --resolution lowest-direct
                  else
                      uv sync --group dev --upgrade
                  fi

            - name: Run tests with pytest
              run: uv run --no-sync pytest

            - name: Upload coverage to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

    zizmor:
        # pre-commit.ci cannot run the zizmor hook (language: system), so the
        # workflow security audit runs here instead.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.13'
                  enable-cache: 'true'

            - name: Install dependencies
              run: uv sync --group dev --frozen

            - name: Run zizmor
              run: uv run --frozen zizmor .github/workflows
