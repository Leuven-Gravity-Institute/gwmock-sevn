name: Build distributions

# Builds the source distribution and the platform wheels, and smoke-tests each wheel.
# gwmock-sevn compiles SEVN's C++ program into every wheel, so one wheel is built per
# platform with cibuildwheel. Called by the publishing workflows; the result is one artifact,
# `python-package-distributions`, holding the sdist and every wheel.

on:
    workflow_call:
        inputs:
            ref:
                description: 'Git ref to build'
                required: true
                type: string
            version:
                description:
                    'Version to stamp into pyproject.toml; empty keeps the
                    git-derived version'
                required: false
                type: string
                default: ''
    workflow_dispatch:
        inputs:
            ref:
                description: 'Git ref to build'
                required: true
                type: string
            version:
                description:
                    'Version to stamp into pyproject.toml; empty keeps the
                    git-derived version'
                required: false
                type: string
                default: ''

permissions:
    contents: read

jobs:
    sdist:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
                  ref: ${{ inputs.ref }}
                  fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.13'
                  enable-cache: 'false'

            - name: Stamp the version
              if: ${{ inputs.version != '' }}
              env:
                  # In `env:` so the input is never interpreted by the shell (zizmor: template-injection).
                  VERSION: ${{ inputs.version }}
              run: |
                  sed -i "s/dynamic = \[\"version\"\]/version = \"$VERSION\"\ndynamic = []/" pyproject.toml

            - name: Build the source distribution
              run: uv build --sdist

            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: sdist
                  path: dist/*.tar.gz

    wheels:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
                  ref: ${{ inputs.ref }}
                  fetch-depth: 0

            - name: Stamp the version
              if: ${{ inputs.version != '' }}
              shell: bash
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  python3 - <<'EOF'
                  import os, pathlib
                  path = pathlib.Path("pyproject.toml")
                  text = path.read_text()
                  path.write_text(text.replace('dynamic = ["version"]', f'version = "{os.environ["VERSION"]}"\ndynamic = []', 1))
                  EOF

            - name: Build and test the wheels
              uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5

            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: wheels-${{ matrix.os }}
                  path: wheelhouse/*.whl

    collect:
        needs: [sdist, wheels]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  path: dist/
                  merge-multiple: true

            - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: python-package-distributions
                  path: dist/
