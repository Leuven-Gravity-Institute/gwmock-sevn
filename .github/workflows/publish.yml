name: Publish to PyPI

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Tag name for the publish (e.g., v1.2.3)'
                required: true
                type: string
    workflow_call:
        inputs:
            tag_name:
                description: 'Tag name for the publish (e.g., v1.2.3)'
                required: true
                type: string

permissions:
    contents: read

jobs:
    build:
        uses: ./.github/workflows/build_distributions.yml # zizmor: ignore[self-repository]
        with:
            ref: ${{ inputs.tag_name || github.event.inputs.tag_name }}

    publish-to-pypi:
        needs: build
        runs-on: ubuntu-latest
        # Set the repository variable PUBLISH_TO_PYPI to "true" once the
        # 'pypi' environment and PyPI trusted publishing are configured.
        if: vars.PUBLISH_TO_PYPI == 'true'
        environment: pypi
        permissions:
            id-token: write

        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  enable-cache: 'false'

            # `uv publish` uploads PEP 740 attestations but does not generate
            # them; sign each distribution in `dist/` first so PyPI records the
            # provenance alongside the upload.
            - name: Generate PEP 740 attestations
              uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

            - name: Publish to PyPI
              run: uv publish --trusted-publishing always
