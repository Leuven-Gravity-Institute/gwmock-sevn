name: Publish to TestPyPI

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Tag name for the publish (e.g., v1.2.3)'
                required: false
                type: string
    workflow_call:
        inputs:
            tag_name:
                description: 'Tag name for the publish (e.g., v1.2.3)'
                required: false
                type: string

permissions:
    contents: read

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
                  ref: ${{ inputs.tag_name || github.sha }}
                  fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.13'
                  enable-cache: 'false'

            - name: Choose the version
              id: version
              env:
                  # Resolved in `env:` rather than in `run:` so the
                  # user-supplied tag name can never be interpreted by the
                  # shell (zizmor: template-injection).
                  TAG_NAME: ${{ inputs.tag_name }}
              run: |
                  if [ -n "$TAG_NAME" ]; then
                    # Use the tag, stripping 'v' prefix if present
                    VERSION=$(echo "$TAG_NAME" | sed 's/^v//')
                  else
                    # For untagged builds, a dev version without the local part, which TestPyPI refuses
                    VERSION=$(uvx --from 'setuptools-scm>=8' python -m setuptools_scm | sed 's/+.*//')
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    build:
        needs: version
        uses: ./.github/workflows/build_distributions.yml # zizmor: ignore[self-repository]
        with:
            ref: ${{ inputs.tag_name || github.sha }}
            version: ${{ needs.version.outputs.version }}

    publish-to-testpypi:
        needs: build
        runs-on: ubuntu-latest
        # Set the repository variable PUBLISH_TO_TESTPYPI to "true" once the
        # 'testpypi' environment and TestPyPI trusted publishing are configured.
        if: vars.PUBLISH_TO_TESTPYPI == 'true'
        environment: testpypi
        permissions:
            id-token: write

        steps:
            - name: Download build artifacts
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: python-package-distributions
                  path: dist/

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  enable-cache: 'false'

            # `uv publish` uploads PEP 740 attestations but does not generate
            # them; sign each distribution in `dist/` first so TestPyPI records
            # the provenance alongside the upload.
            - name: Generate PEP 740 attestations
              uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

            - name: Publish to TestPyPI
              run: >-
                  uv publish --publish-url https://test.pypi.org/legacy/
                  --trusted-publishing always
